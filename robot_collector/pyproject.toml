[project]
name = "collector"
version = "0.1.0"
description = "Modular robot demonstration data collector (canonical master + export profiles)"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "pyyaml", "pyserial"]

[tool.setuptools]
packages = ["collector", "collector.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
