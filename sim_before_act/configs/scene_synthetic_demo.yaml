schema_version: sba-scene/0.1
mode: synthetic_demo
# ======================================================================================================================
# SYNTHETIC DEMO SCENE (invented values, CAD geometry; not a calibrated twin)
# Every world-describing number below (robot base pose, cube, tray, initial configuration) is INVENTED for engineering
# tests. None was measured. Outcome thresholds are ASSUMED and uncalibrated. The robot geometry is the CAD-derived SO-101
# MJCF (read-only, referenced by path); it is not a physically calibrated twin and the documented calibration mismatch
# (docs/STATUS.md) is unresolved.
# ======================================================================================================================

robot:
  model_xml: ../../so101_mujoco/so101_new_calib.xml     # read-only user asset, resolved relative to this file
  model_sha256: null                                     # optional pin

contract:                                                # same meaning as configs/offline_demo.yaml
  representation: absolute_joint_position_targets
  control_hz: 30
  interpolation: zero_order_hold
  min_chunk_len: 1
  max_chunk_len: 200
  max_joint_speed_deg_s: null                            # null => speed check NOT performed
  gripper_mapping: {kind: linear_0_100_to_mjcf_joint_range, zero_means: closed_at_lower_joint_limit, validated: false}

simulation:
  timestep_s: 0.002
  settle_s: 0.5                  # last target held after the chunk
  task_horizon_s: 8.0            # ASSUMED duration of a full pick-and-place; shorter rollouts are 'segment' horizon
  record_every_substeps: 5       # contacts/predicates sampled every 5 substeps (10 ms); shorter transients can be missed
  wall_timeout_s: 60.0
  init_limit_tolerance_deg: 2.0  # initial joint state may exceed simulator limits by at most this (never clipped)

controller:
  source: existing twin (so101_mujoco MJCF, sts3215 class). Recorded read-back is stored in every result.
  note: Position targets are tracked by MuJoCo PD position actuators. This is NOT the real Feetech STS3215 controller.
  expected:                      # checked against the compiled model; a mismatch means the protected model changed
    kp: 998.22
    kv: 2.731
    forcerange_nm: 3.35
    joint_damping: 0.60
    joint_armature: 0.028
    joint_frictionloss: 0.052

mat:
  size_x_m: 0.4                  # 400 x 400 mm: stated in the physical setup description (not re-measured here)
  size_y_m: 0.4
  thickness_m: 0.004             # INVENTED
  friction: 1.0                  # INVENTED
  source: "size from the setup description (not re-measured); thickness/friction INVENTED"

inputs:
  base_to_mat:                   # robot MJCF 'base' frame in the mat frame. Yaw 90 deg: robot looks along mat +Y.
    x_m: 0.0
    y_m: 0.03
    z_m: 0.0
    yaw_deg: 90.0
    sigma_xy_m: null
    sigma_yaw_deg: null
    source: "INVENTED (synthetic demo); the real robot-base-to-mat transform is NOT calibrated"
  cube:
    side_m: 0.04
    mass_kg: 0.025
    x_m: -0.06
    y_m: 0.22
    yaw_deg: 0.0
    sigma_xy_m: null
    sigma_yaw_deg: null
    source: "INVENTED (synthetic demo)"
  tray:
    x_m: 0.10
    y_m: 0.23
    yaw_deg: 0.0
    interior_x_m: 0.12
    interior_y_m: 0.10
    rim_height_m: 0.045
    wall_thickness_m: 0.006
    floor_thickness_m: 0.006
    sigma_xy_m: null
    sigma_yaw_deg: null
    sigma_dim_m: null
    source: "INVENTED (synthetic demo)"
  initial_robot:                 # contract units: five joints in degrees, gripper 0..100
    values: [0.0, -50.0, 40.0, 50.0, 0.0, 40.0]
    source: "INVENTED (synthetic demo)"

calibration:                     # not used by synthetic_demo; physical mode refuses unless these are filled
  reference: {follower_calibration_sha256: null, source: null}
  calibration_blocker_resolved_by: null

outcome:
  thresholds_calibrated: false
  note: "ALL thresholds are ASSUMED and uncalibrated (no calibration data exists); do not read them as physical tolerances."
  joint_limit_tolerance_deg: 1.0          # joint position beyond the simulator limit by more than this -> violation
  penetration_tolerance_m: 0.005          # non-cube contact penetration deeper than this -> violation
  max_abs_qvel_rad_s: 100.0               # beyond this (or NaN/MuJoCo warning) the rollout is INVALID (instability)
  lift_height_m: 0.06                     # cube COM at least this far above the mat top (rest height is side/2 = 0.02)
  inside_tray_margin_m: 0.005             # COM must be this far inside the interior footprint
  gripper_open_pct: 50.0                  # gripper opened beyond this (0..100 contract units) counts as 'released'
  v_settle_m_s: 0.02
  t_settle_s: 0.3
  contact_dist_threshold_m: 0.0           # contact counted when geom distance <= this
  unsafe_contact_categories: [arm_mat_table, arm_self, arm_tray]   # gripper-cube/gripper-mat/gripper-tray/cube-* are expected, NOT violations

perturbations:                   # same format as configs/offline_demo.yaml; ALL uncalibrated placeholders
  enabled: true
  variables:
    robot_state_error_deg: {dist: normal, sigma: 0.5, bound: 1.5, units: degrees, applies_to: 5 arm joints,
                            source: "placeholder - NOT measured", calibrated: false}
    object_xy_m:           {dist: normal, sigma: 0.003, bound: 0.01, units: metres, applies_to: cube x y,
                            source: "placeholder - NOT measured", calibrated: false}
    object_yaw_deg:        {dist: normal, sigma: 3.0, bound: 10.0, units: degrees, applies_to: cube yaw,
                            source: "placeholder - NOT measured", calibrated: false}
    friction_scale:        {dist: uniform, low: 0.8, high: 1.2, units: multiplier, applies_to: cube sliding friction,
                            source: "placeholder - NOT measured", calibrated: false}
    control_noise_deg:     {dist: normal, sigma: 0.2, bound: 0.6, units: degrees, applies_to: per-step arm target noise,
                            source: "placeholder - NOT measured", calibrated: false}
